<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DGM Technology OÜ</title>
  <meta name="description" content="DGM Technology OÜ, Tallinn, Estonia. Maker of SnakeCo for Android.">
  <link rel="icon" href="snakeco.png">
  <style>
    :root { --bg: #f7f6f3; --card: #fff; --ink: #1d1c1a; --muted: #6b6963; --line: #e4e2dc; --link: #1f5fbf; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171614; --card: #22211e; --ink: #f1efea; --muted: #a9a69e; --line: #35332f; --link: #8fb3ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--ink);
           font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0; }
    .meta { color: var(--muted); margin: 0 0 32px; }
    a { color: var(--link); }
    .app { display: flex; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--line);
           border-radius: 14px; padding: 16px; color: inherit; text-decoration: none; }
    .app:hover { border-color: var(--muted); }
    .app img { border-radius: 16px; flex: none; }
    .app h2 { font-size: 1.1rem; margin: 0; }
    .app p { margin: 0; color: var(--muted); }
    .links { margin: 12px 0 0 4px; font-size: 0.95rem; }
    footer { margin-top: 40px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>DGM Technology OÜ</h1>
  <p class="meta">Tallinn, Estonia</p>

  <a class="app" href="https://play.google.com/store/apps/details?id=com.cgm.snakeco.game">
    <img src="snakeco.png" alt="" width="64" height="64">
    <div>
      <h2>SnakeCo</h2>
      <p>The classic snake game with a Colombian flavor · Android</p>
    </div>
  </a>
  <p class="links">
    <a href="https://dfgonzalez88.github.io/snakeco-legal/en/privacy.html">Privacy</a> ·
    <a href="https://dfgonzalez88.github.io/snakeco-legal/en/terms.html">Terms</a> ·
    <a href="https://dfgonzalez88.github.io/snakeco-legal/es/privacy.html">Privacidad</a> ·
    <a href="https://dfgonzalez88.github.io/snakeco-legal/es/terms.html">Condiciones</a>
  </p>

  <footer>
    <a href="mailto:snakeco@flashylearning.app">snakeco@flashylearning.app</a>
  </footer>
</main>
</body>
</html>
